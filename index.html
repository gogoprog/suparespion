<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#14121f">
<title>Supar Espion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14121f;
    --card: #211d33;
    --card2: #2c2745;
    --text: #f2f0fa;
    --muted: #9a94b8;
    --accent: #ffb547;
    --spy: #ff4d6d;
    --ok: #3ddc97;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
    user-select: none;
  }
  #app { width: 100%; max-width: 480px; padding: 20px 16px 32px; display: flex; flex-direction: column; min-height: 100%; }
  h1 { font-size: 2rem; margin: 8px 0 4px; text-align: center; letter-spacing: 1px; }
  h1 span { color: var(--accent); }
  h2 { font-size: 1.2rem; margin: 20px 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .subtitle { text-align: center; color: var(--muted); margin: 0 0 12px; }
  .screen { display: none; flex-direction: column; flex: 1; }

  /* Page d'accueil */
  #s-home { justify-content: center; align-items: center; text-align: center; cursor: pointer; gap: 28px; }
  #s-home svg { width: 100%; max-width: 420px; height: auto; overflow: visible; animation: drop .7s cubic-bezier(.2,1.4,.4,1) both; }
  .logo-script { font-family: "Yellowtail", "Brush Script MT", cursive; }
  .tap { color: var(--muted); font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; animation: pulse 1.6s ease-in-out infinite; }
  .home-tagline { color: var(--text); font-size: 1.05rem; margin: 0; opacity: .85; }
  .langs { display: flex; gap: 12px; }
  .lang { display: flex; align-items: center; gap: 8px; padding: 10px 14px; font-size: .95rem; font-weight: 600;
          background: var(--card); color: var(--muted); border: 2px solid transparent; }
  .lang.on { border-color: var(--accent); color: var(--text); }
  .lang svg { width: 30px !important; height: 20px; border-radius: 3px; animation: none !important; }
  @keyframes drop { from { transform: translateY(-30px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .screen.active { display: flex; }
  .card { background: var(--card); border-radius: var(--radius); padding: 16px; }
  button {
    font: inherit; border: 0; border-radius: 12px; cursor: pointer;
    padding: 14px 18px; font-weight: 700; font-size: 1.05rem;
    background: var(--card2); color: var(--text);
    transition: transform .08s, opacity .2s;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .4; cursor: default; }
  .primary { background: var(--accent); color: #1a1400; }
  .danger { background: var(--spy); color: #fff; }
  .big { width: 100%; padding: 18px; font-size: 1.2rem; margin-top: 12px; }
  .row { display: flex; gap: 8px; align-items: center; }
  input[type=text] {
    flex: 1; min-width: 0; font: inherit; font-size: 1.05rem; padding: 14px;
    border-radius: 12px; border: 2px solid var(--card2); background: var(--bg); color: var(--text);
    user-select: text;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  ul { list-style: none; padding: 0; margin: 12px 0 0; }
  .player {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card2); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
  }
  .player .name { font-weight: 600; font-size: 1.05rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player .score { color: var(--accent); font-size: .9rem; margin-left: 8px; }
  .player button { padding: 6px 12px; font-size: .9rem; background: transparent; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 12px; }
  .opt { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--card2); gap: 12px; }
  .opt:last-child { border-bottom: 0; }
  .opt small { display: block; color: var(--muted); font-weight: 400; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 40px; height: 40px; padding: 0; }
  .stepper b { min-width: 24px; text-align: center; font-size: 1.2rem; }
  .seg { display: flex; background: var(--bg); border-radius: 12px; padding: 4px; }
  .seg button { padding: 8px 12px; font-size: .9rem; background: transparent; color: var(--muted); }
  .seg button.on { background: var(--card2); color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 12px; font-size: .9rem; border-radius: 999px; background: var(--bg); color: var(--muted); border: 2px solid var(--card2); }
  .chip.on { border-color: var(--accent); color: var(--text); }

  .center { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 12px; }
  .pass-name { font-size: 2.4rem; font-weight: 800; color: var(--accent); word-break: break-word; }
  .reveal-box {
    width: 100%; min-height: 220px; border-radius: 20px; background: var(--card);
    display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px;
    border: 3px dashed var(--card2);
  }
  .reveal-box.shown { border-style: solid; border-color: var(--accent); }
  .reveal-box.spy { border-color: var(--spy); }
  .word { font-size: 2.6rem; font-weight: 800; word-break: break-word; }
  .spy-label { color: var(--spy); font-size: 2.4rem; font-weight: 900; letter-spacing: 2px; }
  .hint { color: var(--muted); font-size: .95rem; }
  .progress { color: var(--muted); text-align: center; margin-bottom: 8px; }
  .timer { font-size: 4rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .timer.low { color: var(--spy); }

  .vote-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .vote-grid button { padding: 18px 8px; word-break: break-word; }
  .vote-grid button.out { opacity: .35; text-decoration: line-through; }
  .result-title { font-size: 2rem; font-weight: 900; }
  .result-title.spy { color: var(--spy); }
  .result-title.ok { color: var(--ok); }
  .tag { font-size: .8rem; padding: 3px 8px; border-radius: 999px; background: var(--spy); color: #fff; margin-left: 8px; }
  .tag.civ { background: var(--card); color: var(--muted); }
  .footer { margin-top: auto; padding-top: 16px; }
  .link { background: transparent; color: var(--muted); font-weight: 500; font-size: .95rem; padding: 10px; width: 100%; }
</style>
</head>
<body>
<div id="app">

  <!-- ACCUEIL -->
  <section id="s-home" class="screen active">
    <svg viewBox="0 0 420 240" role="img" aria-label="Supar Espion">
      <g transform="rotate(-8 210 130)">
        <text x="190" y="62" text-anchor="middle" class="logo-script" font-size="84"
              fill="var(--text)" stroke="var(--card2)" stroke-width="12" paint-order="stroke" stroke-linejoin="round">Supar</text>
        <text x="215" y="190" text-anchor="middle" class="logo-script" font-size="132"
              fill="var(--accent)" stroke="var(--card2)" stroke-width="14" paint-order="stroke" stroke-linejoin="round">Espion</text>
      </g>
    </svg>
    <p class="home-tagline" data-i18n="tagline"></p>
    <div class="langs">
      <button class="lang" data-lang="fr">
        <svg viewBox="0 0 3 2" aria-hidden="true"><rect width="1" height="2" fill="#0055a4"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ef4135"/></svg>
        Français
      </button>
      <button class="lang" data-lang="en">
        <svg viewBox="0 0 60 30" aria-hidden="true">
          <clipPath id="uk-c"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
          <clipPath id="uk-t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
          <g clip-path="url(#uk-c)">
            <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
            <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uk-t)" stroke="#c8102e" stroke-width="4"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
            <path d="M30,0 v30 M0,15 h60" stroke="#c8102e" stroke-width="6"/>
          </g>
        </svg>
        English
      </button>
    </div>
    <div class="tap" data-i18n="tap"></div>
  </section>

  <section id="s-setup" class="screen">
    <h1>🕵️ Supar <span>Espion</span></h1>
    <p class="subtitle" data-i18n="tagline"></p>

    <h2 data-i18n="players"></h2>
    <div class="card">
      <form id="add-form" class="row">
        <input id="name-input" type="text" data-i18n-ph="namePh" maxlength="20" autocomplete="off">
        <button class="primary" type="submit" data-i18n="add"></button>
      </form>
      <ul id="player-list"></ul>
    </div>

    <h2>Options</h2>
    <div class="card">
      <div class="opt">
        <div><span data-i18n="spies"></span><small data-i18n="spiesHelp"></small></div>
        <div class="stepper">
          <button id="spy-minus">−</button><b id="spy-count">1</b><button id="spy-plus">+</button>
        </div>
      </div>
      <div class="opt">
        <div><span data-i18n="spyGets"></span><small id="mode-help"></small></div>
        <div class="seg" id="mode-seg">
          <button data-mode="none" data-i18n="modeNone"></button>
          <button data-mode="close" data-i18n="modeClose"></button>
        </div>
      </div>
      <div class="opt">
        <div data-i18n="timerLabel"></div>
        <div class="seg" id="timer-seg">
          <button data-t="0">Off</button>
          <button data-t="180">3 min</button>
          <button data-t="300">5 min</button>
        </div>
      </div>
      <div class="opt" style="display:block">
        <div style="margin-bottom:10px" data-i18n="categories"></div>
        <div class="chips" id="cat-chips"></div>
      </div>
    </div>

    <div class="footer">
      <button id="start-btn" class="primary big" data-i18n="start"></button>
      <button id="reset-scores" class="link" data-i18n="resetScores"></button>
      <button id="change-lang" class="link" data-i18n="changeLang"></button>
    </div>
  </section>

  <!-- DISTRIBUTION -->
  <section id="s-deal" class="screen">
    <div class="progress" id="deal-progress"></div>
    <div class="center">
      <div class="hint" data-i18n="passTo"></div>
      <div class="pass-name" id="deal-name"></div>
      <div class="reveal-box" id="reveal-box"></div>
    </div>
    <button id="deal-next" class="primary big" style="visibility:hidden"></button>
  </section>

  <!-- DISCUSSION -->
  <section id="s-talk" class="screen">
    <div class="center">
      <div class="hint" data-i18n="allSet"></div>
      <div style="font-size:1.3rem" id="first-player"></div>
      <div class="hint" data-i18n="talkHint"></div>
      <div class="timer" id="timer"></div>
      <button id="timer-toggle" style="display:none"></button>
    </div>
    <button id="go-vote" class="primary big" data-i18n="goVote"></button>
  </section>

  <!-- VOTE -->
  <section id="s-vote" class="screen">
    <h2 style="text-align:center" data-i18n="whoSpy"></h2>
    <p class="subtitle" data-i18n="voteHint"></p>
    <div class="vote-grid" id="vote-grid"></div>
    <div class="footer">
      <button id="reveal-all" class="link" data-i18n="giveUp"></button>
    </div>
  </section>

  <!-- RÉSULTAT ÉLIMINATION -->
  <section id="s-elim" class="screen">
    <div class="center">
      <div class="pass-name" id="elim-name"></div>
      <div class="result-title" id="elim-result"></div>
      <div class="hint" id="elim-hint"></div>
    </div>
    <button id="elim-next" class="primary big"></button>
  </section>

  <!-- FIN -->
  <section id="s-end" class="screen">
    <div class="center" style="flex:0; padding-top:24px">
      <div class="result-title" id="end-title"></div>
      <div class="card" style="width:100%">
        <div class="hint" data-i18n="civWord"></div>
        <div class="word" id="end-word" style="font-size:2rem"></div>
        <div id="end-spyword-wrap" style="margin-top:10px">
          <div class="hint" data-i18n="spyWord"></div>
          <div class="word" id="end-spyword" style="font-size:1.6rem; color:var(--spy)"></div>
        </div>
      </div>
    </div>
    <h2 data-i18n="rolesScores"></h2>
    <ul id="end-list"></ul>
    <div class="footer">
      <button id="replay" class="primary big" data-i18n="replay"></button>
      <button id="back-setup" class="link" data-i18n="editPlayers"></button>
    </div>
  </section>

</div>

    if (saved) {
      // Ancien format : une seule liste de catégories (françaises)
      if (Array.isArray(saved.cats)) saved.catsByLang = { fr: saved.cats };
      delete saved.cats;
      Object.assign(state, saved);
    }
  } catch (e) {}
  if (!DICTS[state.lang]) state.lang = "fr";
  for (const lang in DICTS) {
    const cats = (state.catsByLang[lang] || []).filter(c => DICTS[lang][c]);
    state.catsByLang[lang] = cats.length ? cats : Object.keys(DICTS[lang]);
  }
}

function activeCats() { return state.catsByLang[state.lang]; }

function applyLang() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t()[el.dataset.i18n]);
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t()[el.dataset.i18nPh]);
  document.querySelectorAll(".lang").forEach(b => b.classList.toggle("on", b.dataset.lang === state.lang));
}

function setLang(lang) {
  state.lang = lang;
  applyLang();
  renderSetup();
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
  window.scrollTo(0, 0);
}

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function maxSpies() {
  return Math.max(1, Math.floor((state.players.length - 1) / 2));
}

// ---------- Configuration ----------

function renderSetup() {
  const list = $("player-list");
  if (!state.players.length) {
    list.innerHTML = `<li class="empty">${t().emptyPlayers}</li>`;
  } else {
    list.innerHTML = state.players.map((p, i) => `
      <li class="player">
        <span class="name">${esc(p.name)}<span class="score">${t().pts(p.score)}</span></span>
        <span>
          <button data-up="${i}" ${i === 0 ? "disabled" : ""}>▲</button>
          <button data-del="${i}">✕</button>
        </span>
      </li>`).join("");
  }

  state.spies = Math.min(state.spies, maxSpies());
  $("spy-count").textContent = state.spies;
  $("spy-minus").disabled = state.spies <= 1;
  $("spy-plus").disabled = state.spies >= maxSpies();

  document.querySelectorAll("#mode-seg button").forEach(b => b.classList.toggle("on", b.dataset.mode === state.mode));
  $("mode-help").textContent = state.mode === "none" ? t().modeHelpNone : t().modeHelpClose;
  document.querySelectorAll("#timer-seg button").forEach(b => b.classList.toggle("on", +b.dataset.t === state.timer));

  $("cat-chips").innerHTML = Object.keys(dict()).map(c =>
    `<button class="chip ${activeCats().includes(c) ? "on" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");

  $("start-btn").disabled = state.players.length < 3;
  save();
}

$("add-form").addEventListener("submit", e => {
  e.preventDefault();
  const input = $("name-input");
  const name = input.value.trim();
  if (name && !state.players.some(p => p.name.toLowerCase() === name.toLowerCase())) {
    state.players.push({ name, score: 0 });
    renderSetup();
  }
  input.value = "";
  input.focus();
});

$("player-list").addEventListener("click", e => {
  const del = e.target.closest("[data-del]");
  const up = e.target.closest("[data-up]");
  if (del) state.players.splice(+del.dataset.del, 1);
  if (up) {
    const i = +up.dataset.up;
    [state.players[i - 1], state.players[i]] = [state.players[i], state.players[i - 1]];
  }
  if (del || up) renderSetup();
});

$("spy-minus").onclick = () => { state.spies--; renderSetup(); };
$("spy-plus").onclick = () => { state.spies++; renderSetup(); };
$("mode-seg").onclick = e => { const b = e.target.closest("button"); if (b) { state.mode = b.dataset.mode; renderSetup(); } };
$("timer-seg").onclick = e => { const b = e.target.closest("button"); if (b) { state.timer = +b.dataset.t; renderSetup(); } };
$("cat-chips").onclick = e => {
  const b = e.target.closest("[data-cat]");
  if (!b) return;
  const c = b.dataset.cat, cats = activeCats();
  if (cats.includes(c)) {
    if (cats.length > 1) state.catsByLang[state.lang] = cats.filter(x => x !== c);
  } else {
    cats.push(c);
  }
  renderSetup();
};
$("reset-scores").onclick = () => { state.players.forEach(p => p.score = 0); renderSetup(); };

// ---------- Partie ----------

function pickPair() {
  const pool = activeCats().flatMap(c => dict()[c]);
  let fresh = pool.filter(p => !state.recent.includes(p[0]));
  if (!fresh.length) { state.recent = []; fresh = pool; }
  const pair = fresh[Math.floor(Math.random() * fresh.length)].slice();
  // On inverse parfois la paire pour varier
  if (Math.random() < 0.5) pair.reverse();
  state.recent.push(pair[0], pair[1]);
  state.recent = state.recent.slice(-80);
  return pair;
}

function startGame() {
  const [word, spyWord] = pickPair();
  const spyIdx = shuffle(state.players.map((_, i) => i)).slice(0, state.spies);
  game = {
    word, spyWord,
    roles: state.players.map((p, i) => ({ name: p.name, spy: spyIdx.includes(i), out: false })),
    dealIdx: 0
  };
  save();
  showDeal();
}

function showDeal() {
  const p = game.roles[game.dealIdx];
  $("deal-progress").textContent = t().playerN(game.dealIdx + 1, game.roles.length);
  $("deal-name").textContent = p.name;
  const box = $("reveal-box");
  box.className = "reveal-box";
  box.innerHTML = `<div class="hint">${t().tapReveal}</div>`;
  $("deal-next").style.visibility = "hidden";
  $("deal-next").textContent = game.dealIdx === game.roles.length - 1 ? t().gotItStart : t().gotIt;
  show("s-deal");
}

$("reveal-box").onclick = () => {
  const box = $("reveal-box");
  if (box.classList.contains("shown")) return;
  const p = game.roles[game.dealIdx];
  box.classList.add("shown");
  if (p.spy && state.mode === "none") {
    box.classList.add("spy");
    box.innerHTML = `<div class="spy-label">${t().spyLabel}</div>
      <div class="hint">${t().noWord}</div>`;
  } else {
    const w = p.spy ? game.spyWord : game.word;
    box.innerHTML = `<div class="hint">${t().yourWord}</div><div class="word">${esc(w)}</div>`;
  }
  $("deal-next").style.visibility = "visible";
};

$("deal-next").onclick = () => {
  game.dealIdx++;
  if (game.dealIdx < game.roles.length) showDeal();
  else startTalk();
};

// ---------- Discussion ----------

function startTalk() {
  // En mode "sans mot", on évite que l'espion commence
  const alive = game.roles.filter(r => !r.out);
  const candidates = state.mode === "none" ? alive.filter(r => !r.spy) : alive;
  $("first-player").innerHTML = t().starts(esc(candidates[Math.floor(Math.random() * candidates.length)].name));
  stopTimer();
  if (state.timer) {
    let left = state.timer, paused = false;
    const t = $("timer"), btn = $("timer-toggle");
    const draw = () => {
      t.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
      t.classList.toggle("low", left <= 30);
    };
    draw();
    btn.style.display = "";
    btn.textContent = t().pause;
    btn.onclick = () => { paused = !paused; btn.textContent = paused ? t().resume : t().pause; };
    timerInterval = setInterval(() => {
      if (paused || left <= 0) return;
      left--;
      draw();
      if (left === 0 && navigator.vibrate) navigator.vibrate([300, 100, 300]);
    }, 1000);
  } else {
    $("timer").textContent = "";
    $("timer-toggle").style.display = "none";
  }
  show("s-talk");
}

function stopTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = null;
}

$("go-vote").onclick = () => { stopTimer(); showVote(); };

// ---------- Vote ----------

function showVote() {
  $("vote-grid").innerHTML = game.roles.map((r, i) =>
    `<button data-vote="${i}" class="${r.out ? "out" : ""}" ${r.out ? "disabled" : ""}>${esc(r.name)}</button>`).join("");
  show("s-vote");
}

$("vote-grid").onclick = e => {
  const b = e.target.closest("[data-vote]");
  if (!b) return;
  const r = game.roles[+b.dataset.vote];
  r.out = true;

  const spiesLeft = game.roles.filter(x => x.spy && !x.out).length;
  const civsLeft = game.roles.filter(x => !x.spy && !x.out).length;

  $("elim-name").textContent = r.name;
  const res = $("elim-result");
  if (r.spy) {
    res.textContent = t().wasSpy;
    res.className = "result-title ok";
    $("elim-hint").textContent = state.mode === "none" ? t().lastChance : "";
  } else {
    res.textContent = t().notSpy;
    res.className = "result-title spy";
    $("elim-hint").textContent = spiesLeft >= civsLeft ? "" : t().talkResumes;
  }

  let outcome = null;
  if (spiesLeft === 0) outcome = "civils";
  else if (spiesLeft >= civsLeft) outcome = "espions";

  const next = $("elim-next");
  next.className = "primary big";
  if (outcome === "civils" && state.mode === "none") {
    // L'espion démasqué peut voler la victoire en devinant le mot
    next.textContent = t().spyFailed;
    next.onclick = () => endGame("civils");
    $("elim-extra")?.remove();
    const steal = document.createElement("button");
    steal.id = "elim-extra";
    steal.className = "danger big";
    steal.textContent = t().spyGuessed;
    steal.onclick = () => endGame("espions");
    next.after(steal);
  } else {
    $("elim-extra")?.remove();
    if (outcome) {
      next.textContent = t().seeResult;
      next.onclick = () => endGame(outcome);
    } else {
      next.textContent = t().continueTalk;
      next.onclick = () => startTalk();
    }
  }
  show("s-elim");
};

$("reveal-all").onclick = () => endGame("espions");

// ---------- Fin ----------

function endGame(winner) {
  $("elim-extra")?.remove();
  const spiesWin = winner === "espions";
  game.roles.forEach((r, i) => {
    if (r.spy === spiesWin) state.players[i].score += r.spy ? 2 : 1;
  });

  const title = $("end-title");
  title.textContent = spiesWin ? (state.spies > 1 ? t().spiesWin : t().spyWins) : t().civsWin;
  title.className = "result-title " + (spiesWin ? "spy" : "ok");
  $("end-word").textContent = game.word;
  $("end-spyword-wrap").style.display = state.mode === "close" ? "" : "none";
  $("end-spyword").textContent = game.spyWord;

  $("end-list").innerHTML = game.roles.map((r, i) => `
    <li class="player">
      <span class="name">${esc(r.name)}${r.spy ? `<span class="tag">${t().tagSpy}</span>` : `<span class="tag civ">${t().tagCiv}</span>`}</span>
      <span class="score">${t().pts(state.players[i].score)}</span>
    </li>`).join("");
  save();
  show("s-end");
}

$("replay").onclick = startGame;
$("back-setup").onclick = () => { renderSetup(); show("s-setup"); };
$("start-btn").onclick = startGame;
$("s-home").onclick = e => {
  const flag = e.target.closest("[data-lang]");
  if (flag) setLang(flag.dataset.lang);
  else show("s-setup");
};
$("change-lang").onclick = () => setLang(state.lang === "fr" ? "en" : "fr");

load();
applyLang();
renderSetup();
</script>
</body>
</html>
